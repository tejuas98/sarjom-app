<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="100%" height="100%" style="background:#0F172A; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="inputGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="procGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132E22"/>
      <stop offset="100%" stop-color="#0A1C14"/>
    </linearGradient>
    <linearGradient id="outGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1E16"/>
      <stop offset="100%" stop-color="#170F0B"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <text x="550" y="38" text-anchor="middle" fill="#10B981" font-size="20" font-weight="800" letter-spacing="2">SARJOM (सरजोम) — INPUT · PROCESS · OUTPUT (IPO) PIPELINE</text>
  <text x="550" y="60" text-anchor="middle" fill="#94A3B8" font-size="12">End-to-End Edge Architecture for Vernacular Mother-Tongue Pedagogy (100% On-Device)</text>

  <!-- ================= STAGE 1: INPUT STAGE ================= -->
  <g transform="translate(40, 80)">
    <!-- Stage Box -->
    <rect width="290" height="300" rx="24" fill="url(#inputGrad)" stroke="#38BDF8" stroke-width="3" filter="url(#dropShadow)"/>
    <!-- Stage Header Badge -->
    <rect x="25" y="-16" width="240" height="32" rx="16" fill="#0284C7"/>
    <text x="145" y="5" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800" letter-spacing="1">INPUT STAGE</text>

    <!-- Subtitle -->
    <text x="145" y="42" text-anchor="middle" fill="#BAE6FD" font-size="13" font-weight="700">Multi-Modal Classroom Signals</text>

    <!-- Input Item 1: Voice Mic -->
    <rect x="20" y="60" width="250" height="48" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <text x="35" y="90" font-size="20">वा</text>
    <text x="68" y="82" fill="#F8FAFC" font-size="12" font-weight="700">Teacher Voice &amp; Instructions</text>
    <text x="68" y="96" fill="#94A3B8" font-size="10">Hindi speech in noisy classroom</text>

    <!-- Input Item 2: Student Ear -->
    <rect x="20" y="118" width="250" height="48" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <text x="35" y="148" font-size="20">ब</text>
    <text x="68" y="140" fill="#F8FAFC" font-size="12" font-weight="700">Two-Way Student Tribal Audio</text>
    <text x="68" y="154" fill="#94A3B8" font-size="10">Spoken Santhali / Ho / Mundari</text>

    <!-- Input Item 3: Text & Slate -->
    <rect x="20" y="176" width="250" height="48" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <text x="35" y="206" font-size="20">ल</text>
    <text x="68" y="198" fill="#F8FAFC" font-size="12" font-weight="700">Digital Slate Stroke &amp; Text</text>
    <text x="68" y="212" fill="#94A3B8" font-size="10">Touch gestures &amp; quick chips</text>

    <!-- Input Item 4: Audio QR -->
    <rect x="20" y="234" width="250" height="48" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <text x="35" y="264" font-size="20">QR</text>
    <text x="68" y="256" fill="#F8FAFC" font-size="12" font-weight="700">Worksheet Audio QR Scan</text>
    <text x="68" y="270" fill="#94A3B8" font-size="10">Camera scan by rural parents</text>
  </g>

  <!-- Flow Connector 1 -> 2 -->
  <line x1="330" y1="230" x2="385" y2="230" stroke="#10B981" stroke-width="4" stroke-dasharray="6,4" marker-end="url(#arrow)"/>

  <!-- ================= STAGE 2: PROCESSING STAGE ================= -->
  <g transform="translate(395, 80)">
    <!-- Stage Box -->
    <rect width="330" height="300" rx="24" fill="url(#procGrad)" stroke="#10B981" stroke-width="3" filter="url(#dropShadow)"/>
    <!-- Stage Header Badge -->
    <rect x="35" y="-16" width="260" height="32" rx="16" fill="#0E5B37"/>
    <text x="165" y="5" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800" letter-spacing="1">PROCESSING STAGE</text>

    <!-- Subtitle -->
    <text x="165" y="42" text-anchor="middle" fill="#A7F3D0" font-size="13" font-weight="700">SARJOM Edge Pedagogical Engine</text>

    <!-- Gear Icon & Inner Engine -->
    <!-- Processing Block 1 -->
    <rect x="20" y="60" width="290" height="64" rx="12" fill="#143D2A" stroke="#34D399" stroke-width="1.5"/>
    <text x="32" y="98" font-size="22">ध</text>
    <text x="64" y="86" fill="#FFFFFF" font-size="12" font-weight="800">1. Acoustic DSP &amp; Noise Gate</text>
    <text x="64" y="102" fill="#6EE7B7" font-size="10">Bandpass 300Hz-3.4kHz rain filter</text>
    <text x="64" y="116" fill="#A7F3D0" font-size="10">Web Speech API phoneme extraction</text>

    <!-- Processing Block 2 -->
    <rect x="20" y="134" width="290" height="64" rx="12" fill="#143D2A" stroke="#34D399" stroke-width="1.5"/>
    <text x="32" y="172" font-size="22">म</text>
    <text x="64" y="160" fill="#FFFFFF" font-size="12" font-weight="800">2. Vectorized TF-IDF Cosine Space</text>
    <text x="64" y="176" fill="#6EE7B7" font-size="10">0.6 ms avg semantic vector match</text>
    <text x="64" y="190" fill="#A7F3D0" font-size="10">Cosine similarity scoring threshold</text>

    <!-- Processing Block 3 -->
    <rect x="20" y="208" width="290" height="68" rx="12" fill="#143D2A" stroke="#34D399" stroke-width="1.5"/>
    <text x="32" y="248" font-size="22">र</text>
    <text x="64" y="232" fill="#FFFFFF" font-size="12" font-weight="800">3. Munda Morphology &amp; Script Transducer</text>
    <text x="64" y="248" fill="#6EE7B7" font-size="10">Agglutinative affix assembly (Ol Chiki/Warang)</text>
    <text x="64" y="262" fill="#A7F3D0" font-size="10">80:20 NIPUN FLN pedagogical bridge</text>
  </g>

  <!-- Flow Connector 2 -> 3 -->
  <line x1="725" y1="230" x2="780" y2="230" stroke="#F59E0B" stroke-width="4" stroke-dasharray="6,4" marker-end="url(#arrow)"/>

  <!-- ================= STAGE 3: OUTPUT STAGE ================= -->
  <g transform="translate(790, 80)">
    <!-- Stage Box -->
    <rect width="270" height="300" rx="24" fill="url(#outGrad)" stroke="#F59E0B" stroke-width="3" filter="url(#dropShadow)"/>
    <!-- Stage Header Badge -->
    <rect x="25" y="-16" width="220" height="32" rx="16" fill="#D97706"/>
    <text x="135" y="5" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800" letter-spacing="1">OUTPUT STAGE</text>

    <!-- Subtitle -->
    <text x="135" y="42" text-anchor="middle" fill="#FDE68A" font-size="13" font-weight="700">Multi-Modal Classroom Outputs</text>

    <!-- Output Item 1: Native Script -->
    <rect x="15" y="60" width="240" height="48" rx="12" fill="#3B2314" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="28" y="90" font-size="20" font-family="Noto Sans Ol Chiki">ᱚ</text>
    <text x="58" y="82" fill="#FFFFFF" font-size="12" font-weight="700">Native Script Display</text>
    <text x="58" y="96" fill="#FCD34D" font-size="10">Ol Chiki (ᱡᱚᱦᱟᱨ) &amp; Warang Chiti</text>

    <!-- Output Item 2: Speech Audio -->
    <rect x="15" y="118" width="240" height="48" rx="12" fill="#3B2314" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="28" y="148" font-size="20" font-family="Noto Sans Ol Chiki">ᱦ</text>
    <text x="58" y="140" fill="#FFFFFF" font-size="12" font-weight="700">Dual Speech Audio (TTS)</text>
    <text x="58" y="154" fill="#FCD34D" font-size="10">Native pronunciation + Hindi</text>

    <!-- Output Item 3: Audio QR Worksheets -->
    <rect x="15" y="176" width="240" height="48" rx="12" fill="#3B2314" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="28" y="206" font-size="20">A4</text>
    <text x="58" y="198" fill="#FFFFFF" font-size="12" font-weight="700">Bilingual Audio QR Sheets</text>
    <text x="58" y="212" fill="#FCD34D" font-size="10">300 DPI printables for home</text>

    <!-- Output Item 4: Governance Sync -->
    <rect x="15" y="234" width="240" height="48" rx="12" fill="#3B2314" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="28" y="264" font-size="20">DB</text>
    <text x="58" y="256" fill="#FFFFFF" font-size="12" font-weight="700">Local Encrypted Record Store</text>
    <text x="58" y="270" fill="#FCD34D" font-size="10">zero upload; optional pen-drive export</text>
  </g>

  <!-- Bottom Metric Bar -->
  <rect x="40" y="390" width="1020" height="24" rx="6" fill="#1E293B"/>
  <text x="550" y="406" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="600">
    » End-to-End Latency: <tspan fill="#10B981" font-weight="800">0.6 ms avg</tspan> (~4,900x faster than SLA) &#160;·&#160; • Measured Engine Heap: <tspan fill="#38BDF8" font-weight="800">5.8 MB</tspan> &#160;·&#160; › Offline Availability: <tspan fill="#F59E0B" font-weight="800">100% Pure Edge</tspan>
  </text>
</svg>
