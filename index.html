<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="सरजोम SARJOM" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="theme-color" content="#0E5B37" />
    <meta name="description" content="AI-Powered Vernacular Pedagogy and Real-Time Translation Tool for Jharkhand MTB-MLE Primary Education in Ho, Mundari, Santhali, and Sadri" />
    <title>सरजोम (SARJOM) — AI Vernacular Pedagogy Platform (Jharkhand MTB-MLE)</title>

    <!-- Google Fonts: Sketch headers, Inter body, and Native Scripts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&family=Finger+Paint&family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Noto+Sans+Ol+Chiki:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // 1. Proactively purge legacy stale caches from previous builds
      if ('caches' in window) {
        ['palash-setu-cache-v1', 'palash-setu-cache-v2'].forEach(name => {
          caches.delete(name).catch(() => {});
        });
      }

      // 2. Auto-recovery: If a bundle fails to load or root is blank due to stale cache, purge & reload
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          console.warn('[SARJOM] Stale asset load failed, purging caches and recovering...');
          if ('caches' in window) {
            caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))).then(() => {
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(regs => {
                  Promise.all(regs.map(r => r.unregister())).then(() => window.location.reload());
                });
              } else {
                window.location.reload();
              }
            });
          }
        }
      }, true);

      // 3. Service Worker registration with instant update check
      if ('serviceWorker' in navigator && typeof window.Capacitor === 'undefined' && !window.Capacitor?.isNativePlatform?.()) {
        if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
          // In local dev, unregister service workers and purge caches to prevent stale bundles
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const registration of registrations) {
              registration.unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then((names) => {
              for (const name of names) {
                caches.delete(name);
              }
            });
          }
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then((reg) => {
                console.log('SARJOM PWA Service Worker Registered', reg.scope);
                reg.update();
                reg.addEventListener('updatefound', () => {
                  const worker = reg.installing;
                  if (worker) {
                    worker.addEventListener('statechange', () => {
                      if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                        window.location.reload();
                      }
                    });
                  }
                });
              })
              .catch((err) => console.log('SW registration skipped', err));
          });
        }
      }
    </script>
  </body>
</html>
