<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 700px;
  background: #fff;
  font-family: 'Segoe UI', Arial, sans-serif;
  padding: 24px 28px 28px;
}

.card {
  border: 2px solid #ccc;
  border-radius: 14px;
  padding: 20px 18px 16px;
  background: #fff;
}

.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

/* left: teacher */
.person-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 130px;
  flex-shrink: 0;
}
.person-box img {
  width: 110px;
  height: 120px;
  object-fit: contain;
}
.speech-bubble {
  background: #FFF9C4;
  border: 1.5px solid #F9A825;
  border-radius: 10px;
  padding: 5px 10px;
  font-size: 16px;
  font-weight: 700;
  color: #333;
  margin-top: 6px;
  text-align: center;
}
.lang-label {
  font-size: 10px;
  color: #888;
  margin-top: 3px;
  font-weight: 600;
  text-align: center;
}

/* center: gear + arrow */
.center {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.arrow-line {
  display: flex;
  align-items: center;
  gap: 4px;
}
.dash {
  width: 28px;
  height: 2px;
  background: #555;
}
.arrowhead {
  width: 0;
  height: 0;
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
  border-left: 10px solid #555;
}

/* right: student */
.output-bubble {
  background: #E8F5E9;
  border: 1.5px solid #66BB6A;
  border-radius: 10px;
  padding: 5px 10px;
  font-size: 15px;
  font-weight: 700;
  color: #1B5E20;
  margin-top: 6px;
  text-align: center;
}

.title {
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  color: #555;
  margin-top: 14px;
  letter-spacing: 0.5px;
}
</style>
</head>
<body>

<div class="card">
  <div class="row">

    <!-- Teacher -->
    <div class="person-box">
      <img src="teacher_colorful.jpg" alt="Teacher"/>
      <div class="speech-bubble">शुभ प्रभात</div>
      <div class="lang-label">Teacher speaks Hindi</div>
    </div>

    <!-- Gear + Arrow -->
    <div class="center">
      <!-- gear SVG -->
      <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
        <path d="M26 8 L28.5 3 L23.5 3 Z M26 44 L28.5 49 L23.5 49 Z
                 M8 26 L3 28.5 L3 23.5 Z M44 26 L49 28.5 L49 23.5 Z
                 M13 13 L9 9 L13 5 Z M39 39 L43 43 L39 47 Z
                 M13 39 L9 43 L5 39 Z M39 13 L43 9 L47 13 Z"
              fill="#9E9E9E"/>
        <circle cx="26" cy="26" r="11" fill="#424242" stroke="#222" stroke-width="1.5"/>
        <circle cx="26" cy="26" r="5.5" fill="#757575"/>
        <circle cx="40" cy="14" r="5.5" fill="#BDBDBD" stroke="#555" stroke-width="1"/>
        <circle cx="40" cy="14" r="2.5" fill="#9E9E9E"/>
      </svg>
      <!-- arrow -->
      <div class="arrow-line">
        <div class="dash"></div>
        <div class="dash"></div>
        <div class="dash"></div>
        <div class="arrowhead"></div>
      </div>
    </div>

    <!-- Student -->
    <div class="person-box">
      <img src="student_colorful.jpg" alt="Student"/>
      <div class="output-bubble">ᱡᱚᱦᱟᱨ</div>
      <div class="lang-label">Student hears Tribal audio</div>
    </div>

  </div>

  <div class="title">How Translation Works</div>
</div>

</body>
</html>
